name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  bundle:
    name: bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - name: Fail when action/index.mjs was not regenerated
        run: git diff --exit-code -- action/index.mjs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and smoke-test the tarball
        run: |
          npm pack --silent
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/dependabot-gaps-*.tgz
          npx --no-install dependabot-gaps --version
          npx --no-install dependabot-gaps --list-rules

  action-selftest:
    name: action-selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fixture with gaps must fail the step
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: test/fixtures/monorepo
          sarif-file: ${{ runner.temp }}/gaps.sarif
      - name: The failing fixture really failed and wrote SARIF
        run: |
          if [ "${{ steps.bad.outcome }}" != "failure" ]; then echo "expected the fixture to fail, got ${{ steps.bad.outcome }}"; exit 1; fi
          node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const r=j.runs[0].results.map(x=>x.ruleId);if(j.version!=='2.1.0'||!r.includes('uncovered-manifest')){console.error(r);process.exit(1)}console.log('results:',r.length)" "$RUNNER_TEMP/gaps.sarif"
      - name: fail-on never lets the same fixture pass
        uses: ./
        with:
          path: test/fixtures/monorepo
          fail-on: never
      - name: Clean fixture passes
        uses: ./
        with:
          path: test/fixtures/clean

  dogfood:
    name: dogfood (this repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          fail-on: warning

  node24-ready:
    name: node24-ready (this repository's workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cosmichackerx/node24-ready@v0.2.0
        with:
          path: .github action.yml
