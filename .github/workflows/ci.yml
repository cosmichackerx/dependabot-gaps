name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  bundle:
    name: bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - name: Fail when action/index.mjs was not regenerated
        run: git diff --exit-code -- action/index.mjs

  glob-oracle:
    name: glob model vs real Ruby Dir.glob
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ruby --version
      - name: Regenerate the oracle with the runner's Ruby and compare
        run: |
          ruby scripts/glob-differential.rb > /tmp/glob-ruby.json
          node -e "
            const a = JSON.parse(require('fs').readFileSync('/tmp/glob-ruby.json','utf8'));
            const b = JSON.parse(require('fs').readFileSync('test/fixtures/glob-ruby.json','utf8'));
            delete a.ruby; delete b.ruby;
            if (JSON.stringify(a) !== JSON.stringify(b)) { console.error('Ruby Dir.glob output differs from the committed fixture'); process.exit(1); }
            console.log('oracle fixture matches this Ruby');"
      - run: npm run build
      - name: Random-pattern fuzz against the real Ruby (fails above 0.5% mismatches)
        run: RUBY=ruby node scripts/glob-fuzz.mjs 3000 7 --max-rate 0.005

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and smoke-test the tarball
        run: |
          npm pack --silent
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/dependabot-gaps-*.tgz
          npx --no-install dependabot-gaps --version
          npx --no-install dependabot-gaps --list-rules

  action-selftest:
    name: action-selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fixture with gaps must fail the step
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: test/fixtures/monorepo
          sarif-file: ${{ runner.temp }}/gaps.sarif
      - name: The failing fixture really failed and wrote SARIF
        run: |
          if [ "${{ steps.bad.outcome }}" != "failure" ]; then echo "expected the fixture to fail, got ${{ steps.bad.outcome }}"; exit 1; fi
          node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const r=j.runs[0].results.map(x=>x.ruleId);if(j.version!=='2.1.0'||!r.includes('uncovered-manifest')){console.error(r);process.exit(1)}console.log('results:',r.length)" "$RUNNER_TEMP/gaps.sarif"
      - name: fail-on never lets the same fixture pass
        uses: ./
        with:
          path: test/fixtures/monorepo
          fail-on: never
      - name: Clean fixture passes
        uses: ./
        with:
          path: test/fixtures/clean

  dogfood:
    name: dogfood (this repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          fail-on: warning

  node24-ready:
    name: node24-ready (this repository's workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cosmichackerx/node24-ready@v0.2.0
        with:
          path: .github action.yml
